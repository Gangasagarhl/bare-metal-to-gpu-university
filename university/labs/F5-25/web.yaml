# web.yaml - a replicated web service for a Kubernetes learning cluster (F5-25 lab).
# NOT RUN in this build (no Kubernetes in the build container). Field names written from
# memory: check every one against the Kubernetes documentation before use (see F5-25).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example/web:1.0     # placeholder: an image your cluster can pull
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
